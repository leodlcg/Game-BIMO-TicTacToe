<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>

    <section id="home-content-game">

        <img id="arm-left" src="img/arm-left.png">

            <div id="home-start-game">

                <dialog id="dialog-start">

                    <h1 id="form-title">Create Player</h1>

                    <form id="form-create-players">

                        <label for="name-Player01">Nick Player 01:</label>
                        <input id="name-Player01" type="text" name="Player01" maxlength="7" pattern="[A-Za-zÀ-ÿ\s]+" title="Use apenas letras" placeholder="Apenas letras" required>

                        <label for="name-Player02">Nick Player 02:</label>
                        <input id="name-Player02" type="text" name="Player02" maxlength="7" pattern="[A-Za-zÀ-ÿ\s]+" title="Use apenas letras" placeholder="Apenas letras" required>

                        <label for="checkbox-bot">Player2 bot?</label>
                        <input id="checkbox-bot" type="checkbox">

                        <button id="form-bth-play" type="submit">PLAY</button>

                    </form>

                    <button id="form-bth-back">BACK</button>

                </dialog>

                <h1 id="home-title">TicTacToe</h1>

                <button class="btn-home-game" id="btn_start">Start</button>
                    <img src="img/cursor.png" id="cursor">
                <a class="btn-home-game" id="link_HowToPlay" href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">How to play</a>
                <a class="btn-home-game" id="link_GitHub" href="https://github.com/leodlcg" target="_blank">Hub</a>

            </div>

        <img id="arm-right" src="img/arm-right.png">

    </section>

    <section id="content-game">

        <div id="content-player01">
            <h3 class="title-win">Player01</h3>
            <h1 class="title-player" id="title-player01">Player01</h1>
            <h3 class="title-win" id="win-player01">Win:</h3>
        </div>

        <img id="arm-left-game" src="img/arm-left.png">

        <div id="backgroud-game">

            <div id="game">

                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>
                <button class="btn-positon-game"></button>

            </div>

            <button id="btn-reset-game" class="btn-game">Reset</button>
            <button id="btn-quit-game" class="btn-game">Quit</button>

        </div>

        <img id="arm-right-game" src="img/arm-right.png">

        <div id="content-player02">
            <h3 class="title-win">Player02</h3>
            <h1 class="title-player" id="title-player02">Player02</h1>
            <h3 class="title-win" id="win-player02">Win:</h3>
        </div>

    </section>
    
</body>
<script type="module" src="controller.js" defer></script>
</html>
